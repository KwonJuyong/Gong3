<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 평가단 - 서버 점검 중</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; background: #F9FAFB; display: flex; align-items: center; justify-content: center; padding: 24px;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased; color: #111827;
    }
    .card {
      width: 100%; max-width: 480px; text-align: center;
      background: #fff; border-radius: 16px; padding: 40px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.07); border: 1px solid #E5E7EB;
    }
    .icon {
      width: 64px; height: 64px; margin: 0 auto 24px; border-radius: 50%;
      background: #FFFBEB; display: flex; align-items: center; justify-content: center;
    }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; color: #6B7280; line-height: 1.6; }
    .status {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 16px; border-radius: 8px; background: #F9FAFB;
      font-size: 12px; color: #6B7280; margin-top: 24px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; background: #D97706;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .footer { font-size: 12px; color: #9CA3AF; margin-top: 16px; }
  </style>
</head>
<body>
  <div>
    <div class="card">
      <div class="icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
        </svg>
      </div>
      <h1>서버 점검 중</h1>
      <p>더 나은 서비스를 위해 시스템 점검을 진행하고 있습니다.<br>잠시 후 다시 접속해 주세요.</p>
      <div class="status"><span class="dot"></span>점검 진행 중</div>
    </div>
    <p class="footer">문의: labchain.hallym@gmail.com</p>
  </div>
</body>
</html>
